<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BrainBase Email Signature</title>
  <style>
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
      box-sizing: border-box;
    }
    .preview {
      background: white;
      padding: 48px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      max-width: 640px;
      width: 100%;
    }
    .instructions {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e7eb;
      line-height: 1.6;
    }
    .instructions strong { color: #374151; }
    .sig-wrapper { padding: 8px 0; }
  </style>
</head>
<body>
  <div class="preview">
    <div class="instructions">
      <strong>How to use:</strong> Select everything inside the grey border below → Copy (Ctrl+C) → paste directly into Gmail or Outlook signature settings. The formatting will carry over.
    </div>

    <!-- ─── SIGNATURE ─────────────────────────────────────────────────────── -->
    <div class="sig-wrapper">
      <table cellpadding="0" cellspacing="0" border="0" style="font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; border-collapse: collapse; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
        <tr>
          <!-- Left accent bar -->
          <td style="width: 4px; background: linear-gradient(180deg, #6366F1 0%, #8B5CF6 100%); padding: 0;"></td>

          <!-- Main content -->
          <td style="padding: 14px 22px 14px 18px; background: #ffffff;">
            <table cellpadding="0" cellspacing="0" border="0">

              <!-- BrainBase logo text -->
              <tr>
                <td style="padding-bottom: 8px;">
                  <span style="font-size: 17px; font-weight: 800; letter-spacing: 0.13em; color: #0a0b0f; line-height: 1; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">BR</span><span style="font-size: 17px; font-weight: 800; letter-spacing: 0.13em; color: #6366F1; line-height: 1; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">Λ</span><span style="font-size: 17px; font-weight: 800; letter-spacing: 0.13em; color: #0a0b0f; line-height: 1; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">INB</span><span style="font-size: 17px; font-weight: 800; letter-spacing: 0.13em; color: #0a0b0f; line-height: 1; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">Λ</span><span style="font-size: 17px; font-weight: 800; letter-spacing: 0.13em; color: #0a0b0f; line-height: 1; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">SE</span>
                </td>
              </tr>

              <!-- Divider -->
              <tr>
                <td style="padding-bottom: 8px;">
                  <div style="height: 1px; background: #e5e7eb; width: 100%;"></div>
                </td>
              </tr>

              <!-- Name -->
              <tr>
                <td style="padding-bottom: 2px;">
                  <span style="
                    font-size: 14px;
                    font-weight: 700;
                    color: #111827;
                    letter-spacing: -0.01em;
                  ">James Palmer</span>
                </td>
              </tr>

              <!-- Role -->
              <tr>
                <td style="padding-bottom: 9px;">
                  <span style="
                    font-size: 12px;
                    font-weight: 500;
                    color: #6b7280;
                    letter-spacing: 0.01em;
                  ">Founder &amp; Director</span>
                </td>
              </tr>

              <!-- Contact links -->
              <tr>
                <td>
                  <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <!-- Email -->
                      <td style="padding-right: 10px;">
                        <a href="mailto:hello@hlna.com.au" style="
                          font-size: 12px;
                          color: #6366F1;
                          text-decoration: none;
                          font-weight: 500;
                        ">hello@hlna.com.au</a>
                      </td>
                      <!-- Separator dot -->
                      <td style="padding-right: 10px; color: #d1d5db; font-size: 12px;">·</td>
                      <!-- Website -->
                      <td>
                        <a href="https://brainbase.com.au" style="
                          font-size: 12px;
                          color: #6366F1;
                          text-decoration: none;
                          font-weight: 500;
                        ">brainbase.com.au</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </div>
    <!-- ─── END SIGNATURE ─────────────────────────────────────────────────── -->

  </div>
</body>
</html>
